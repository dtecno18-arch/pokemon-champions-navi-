name: Official M-C roster audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Unit-test official roster extraction
        run: python -m unittest discover -s tests -p test_official_roster_parser.py
      - name: Reconcile complete official M-C non-Mega roster
        run: python tools/audit_official_mc.py
      - name: Preserve full diff even if audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-roster-audit
          path: |
            mc-roster-audit.json
            mc-official-body.txt
            mc-official-network.json
            mc-official-snapshot.png
          if-no-files-found: warn
